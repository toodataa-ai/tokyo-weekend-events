name: Probe Nerima Event Source

on:
  push:
    branches: [feature/nerimakanko-events]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect Nerima pagination
        run: |
          python - <<'PY'
          from nerimakanko import _fetch, _discover_detail_urls, _discover_pagination_urls
          for month in ('2026-10','2026-11','2026-12'):
              url = f'https://www.nerimakanko.jp/event/search.php?month={month}'
              page = _fetch(url)
              details = _discover_detail_urls(page, url)
              pages = _discover_pagination_urls(page, url, month)
              print(month, 'detail links on first page=', len(details))
              print(month, 'pagination count=', len(pages))
              for p in pages:
                  print(' ', p)
          PY
