name: Validate Suginami Festival Source

on:
  push:
    branches: [feature/suginami-festival-events]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and parser checks
        run: |
          python -m py_compile scraper.py build_site.py nerimakanko.py build_with_nerima.py suginami.py build_with_extra_sources.py
          python - <<'PY'
          import datetime
          from suginami import parse_event_schedule
          s = parse_event_schedule('2026年10月3日（土曜日） から2026年10月4日（日曜日）', datetime.date(2026,10,4))
          assert s['ranges'] == [(datetime.date(2026,10,3), datetime.date(2026,10,4))], s
          s = parse_event_schedule('2026年10月4日（日曜日）', datetime.date(2026,10,4))
          assert s['dates'] == [datetime.date(2026,10,4)], s
          PY
      - name: Build existing sources plus Suginami
        run: |
          set -o pipefail
          python build_with_extra_sources.py | tee /tmp/build.log
          if grep -E '杉並区おまつり (月別一覧取得失敗|詳細取得失敗)' /tmp/build.log; then
            echo 'Suginami fetch errors detected'
            exit 1
          fi
      - name: Verify Suginami weekend output
        run: |
          python - <<'PY'
          import glob, json
          found = []
          for path in glob.glob('site/data/2026-*.json'):
              if path.endswith('manifest.json'):
                  continue
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              for ev in data.get('events', []):
                  if ev.get('area') == '杉並区':
                      found.append((path, ev.get('name'), ev.get('period'), ev.get('url')))
          print('Suginami weekend entries:', len(found))
          for row in found[:40]: print(row[:3])
          if not found:
              raise SystemExit('No Suginami festival events generated')
          if not any('第40回高井戸センターまつり' in (name or '') for _, name, _, _ in found):
              raise SystemExit('Expected Suginami festival was not generated')
          with open('site/data/2026-10-10.json', encoding='utf-8') as f:
              weekend = json.load(f)
          wrong = [ev.get('name') for ev in weekend.get('events', []) if ev.get('area') == '杉並区' and 'Paella Summit' in (ev.get('name') or '')]
          if wrong:
              raise SystemExit(f'Monday-only event leaked into weekend output: {wrong}')
          PY
