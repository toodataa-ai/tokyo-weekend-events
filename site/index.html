<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東京 週末イベント</title>
<style>
:root{--navy:#16324f;--ink:#1a1a1a;--sub:#666}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
     background:#f4f6f8;color:var(--ink)}
header{background:linear-gradient(135deg,var(--navy),#2e5e8c);color:#fff;padding:16px 16px 14px;
        position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{margin:0 0 8px;font-size:19px;line-height:1.4}
.navlink{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.18);padding:4px 10px;
         border-radius:99px;text-decoration:none;vertical-align:middle;border:none;cursor:pointer;font-family:inherit}
.navlink:hover{background:rgba(255,255,255,.3)}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar input[type=date]{border:none;border-radius:8px;padding:7px 9px;font-size:13.5px;font-family:inherit}
.datebar button{border:none;border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:700;
                 background:#f6d97a;color:#16324f;cursor:pointer}
.datebar button:active{transform:scale(.97)}
.range{font-size:12.5px;opacity:.9;margin-top:8px}
.count{font-size:12px;opacity:.85;margin-top:4px}
.meta{font-size:11.5px;opacity:.75;margin-top:3px}
.msg{font-size:12.5px;background:#fff3cd;color:#7a5c1e;padding:6px 10px;border-radius:8px;margin-top:8px;
     display:none;align-items:center;gap:8px;flex-wrap:wrap}
.retry-btn{flex:0 0 auto;border:none;background:#7a5c1e;color:#fff;border-radius:6px;
           padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.retry-btn:active{opacity:.8}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;
       border-bottom:1px solid #e3e6ea;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:99px;
      padding:5px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--c);color:#fff}
.chip span{opacity:.75;margin-left:2px}
main{padding:12px;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{display:block;background:#fff;border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink);
      box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #eceff2;transition:transform .1s}
.card:active{transform:scale(.98)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e3e6ea}
.thumb.ph{display:flex;align-items:center;justify-content:center}
.thumb.ph span{color:#fff;font-size:34px;font-weight:800;opacity:.85}
.card-body{padding:10px 12px 12px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.date{color:#c0392b;font-size:12px;font-weight:600}
.card-name{font-size:14px;line-height:1.45;font-weight:600}
.card-src{font-size:11px;color:#999;margin-top:5px}
.card-src a{color:#999;text-decoration:none}
.card-src a:hover{text-decoration:underline}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.loading{text-align:center;color:var(--sub);padding:40px 0}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:20px 16px 30px}
.visitor-stats{margin-bottom:6px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>&#127961; 東京 週末イベント　<button class="navlink" onclick="openCopy()">📋 コピペ用リスト</button></h1>
  <div class="datebar">
    <input type="date" id="dateInput">
    <button id="updateBtn">この週末を表示</button>
  </div>
  <div class="range" id="rangeText"></div>
  <div class="count" id="countText"></div>
  <div class="meta" id="metaText"></div>
  <div class="msg" id="msgBox">
    <span id="msgText"></span>
    <button class="retry-btn" id="retryBtn" style="display:none" onclick="retryLoad()">もう一度試す</button>
  </div>
</header>
<nav class="chips" id="chips"></nav>
<main>
  <div class="grid" id="grid"><div class="loading">読み込み中...</div></div>
</main>
<footer>
  <div id="visitorText" class="visitor-stats"></div>
  自動収集（tokyofes.info 各エリアサイト・iterrace.jp 等）。日程・開催有無は必ず各公式ページでご確認ください。<br>
  事前生成データ: 直近12週分（毎週自動更新）
</footer>
<script>
const AREA_COLOR = {"墨田": "2E86AB", "浅草": "3BAA6F", "上野公園": "8E5EA8", "秋葉原": "1BA6C4", "日比谷公園": "D98324", "池袋": "5B6670", "新宿": "C0392B", "中野": "2E7D57", "代々木公園": "6C5CE7", "渋谷": "E17055", "六本木": "0984E3", "豊洲": "B8891F", "お台場": "16324F", "品川": "D64550", "立川": "2C3E50", "練馬（アイテラス）": "27AE60"};
let MANIFEST = null;
let lastSatIso = null;

function fmtRange(sat, sun){
  const s = new Date(sat+'T00:00:00'), e = new Date(sun+'T00:00:00');
  const w = ['日','月','火','水','木','金','土'];
  return `${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()}(${w[s.getDay()]}) 〜 ${e.getMonth()+1}/${e.getDate()}(${w[e.getDay()]})`;
}

function isoLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 土日は当日、それ以外は次の土曜日を返す
function defaultDate(){
  const t = new Date();
  const wd = t.getDay();
  if(wd === 6 || wd === 0) return isoLocal(t);
  const diff = 6 - wd;
  return isoLocal(new Date(t.getFullYear(), t.getMonth(), t.getDate() + diff));
}

function saturdayOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const base = new Date(y, m-1, d);
  const wd = base.getDay();
  const diff = (wd === 6) ? 0 : (wd === 0) ? -1 : (6 - wd);
  const sat = new Date(y, m-1, d + diff);
  return isoLocal(sat);
}

function showMsg(text, showRetry){
  const box = document.getElementById('msgBox');
  if(!text){ box.style.display='none'; document.getElementById('msgText').textContent=''; return; }
  box.style.display='flex';
  document.getElementById('msgText').textContent = text;
  document.getElementById('retryBtn').style.display = showRetry ? '' : 'none';
}

function retryLoad(){
  if(lastSatIso) loadWeekend(lastSatIso);
}

function showMeta(manifest){
  const total = manifest.weekends.reduce((s,w) => s + (w.count || 0), 0);
  document.getElementById('metaText').textContent =
    `最終更新: ${manifest.generated} ／ 登録イベント: ${total}件（全期間合計）`;
}

async function updateVisitorCount(){
  const today = isoLocal(new Date());
  const lastVisitDate = localStorage.getItem('twe_visit_date');
  const isNewDay = lastVisitDate !== today;

  // 当日カウント（デバイスごと・1日1カウント）
  let todayCount = parseInt(localStorage.getItem('twe_today_count') || '0', 10);
  todayCount = isNewDay ? 1 : todayCount + 1;
  localStorage.setItem('twe_visit_date', today);
  localStorage.setItem('twe_today_count', String(todayCount));

  // 累計カウント: counterapi.dev（新規日なら+1、同日はキャッシュ値を表示）
  let cumulativeStr = localStorage.getItem('twe_cumulative_cache') || '---';
  try{
    const endpoint = isNewDay
      ? 'https://api.counterapi.dev/v1/toodataa-ai/tokyo-weekend-events/up'
      : 'https://api.counterapi.dev/v1/toodataa-ai/tokyo-weekend-events';
    const res = await fetch(endpoint, {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      if(data.count != null){
        cumulativeStr = data.count.toLocaleString();
        localStorage.setItem('twe_cumulative_cache', cumulativeStr);
      }
    }
  }catch(e){}

  document.getElementById('visitorText').textContent =
    `来訪者数: 累計 ${cumulativeStr}人 ／ 本日 ${todayCount}人`;
}

// periodStr("M/D" or "M/D〜M/D")の終了日をDateで返す。年はsatStrから推定。
function parseEndDate(periodStr, satStr){
  const satY = parseInt(satStr.split('-')[0]);
  const satM = parseInt(satStr.split('-')[1]);
  const parts = periodStr.split('〜');
  const endPart = parts[parts.length - 1].trim();
  const match = endPart.match(/^(\d+)\/(\d+)/);
  if(!match) return null;
  const m = parseInt(match[1]);
  const d = parseInt(match[2]);
  // 終了月がsat月より大幅に小さい場合は翌年（12月に1月イベントを見るケース）
  let year = satY;
  if(m < satM - 6) year = satY + 1;
  return new Date(year, m - 1, d);
}

function render(data){
  const grid = document.getElementById('grid');
  const chips = document.getElementById('chips');
  document.getElementById('rangeText').textContent =
    fmtRange(data.sat, data.sun) + ' 開催中・開催';
  const byArea = {};
  data.events.forEach(ev => { (byArea[ev.area] = byArea[ev.area]||[]).push(ev); });
  document.getElementById('countText').textContent =
    `該当 ${data.events.length} 件 ／ ${Object.keys(byArea).length} エリア`;

  // 今週末終了 = 終了日 < 来週の土曜日
  const nextSat = new Date(data.sat + 'T00:00:00');
  nextSat.setDate(nextSat.getDate() + 7);
  const endingEvents = data.events.filter(ev => {
    const end = parseEndDate(ev.period, data.sat);
    return end && end < nextSat;
  });

  let chipHtml = `<button class="chip active" data-area="__all__" style="--c:#16324f">すべて <span>${data.events.length}</span></button>`;
  chipHtml += `<button class="chip" data-area="__ending__" style="--c:#c0392b">今週末終了 <span>${endingEvents.length}</span></button>`;
  Object.keys(byArea).forEach(area => {
    const c = AREA_COLOR[area] || '2E86AB';
    chipHtml += `<button class="chip" data-area="${area}" style="--c:#${c}">${area} <span>${byArea[area].length}</span></button>`;
  });
  chips.innerHTML = chipHtml;

  if(data.events.length === 0){
    grid.innerHTML = '<p class="empty">この週末に開催されるイベントは見つかりませんでした。</p>';
    return;
  }
  function srcHost(url){
    try{ return new URL(url).hostname.replace(/^www\./, ''); }catch(e){ return ''; }
  }
  grid.innerHTML = data.events.map(ev => {
    const c = AREA_COLOR[ev.area] || '2E86AB';
    const end = parseEndDate(ev.period, data.sat);
    const isEnding = end && end < nextSat;
    const thumb = ev.image
      ? `<img class="thumb" src="${ev.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="thumb ph" style="background:#${c}"><span>${(ev.area||'?').slice(0,1)}</span></div>`;
    const src = ev.source ? `<div class="card-src">情報元: ${srcHost(ev.source)}</div>` : '';
    return `<a class="card" data-area="${ev.area}" data-ending="${isEnding}" href="${ev.url}" target="_blank" rel="noopener">
      ${thumb}
      <div class="card-body">
        <div class="card-top">
          <span class="badge" style="background:#${c}">${ev.area}</span>
          <span class="date">${ev.period}</span>
        </div>
        <div class="card-name">${ev.name || ev.url}</div>
        ${src}
      </div>
    </a>`;
  }).join('\n');
}

document.getElementById('chips').addEventListener('click', function(e){
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const area = btn.dataset.area;
  document.querySelectorAll('#grid .card').forEach(card=>{
    if(area === '__ending__'){
      card.style.display = card.dataset.ending === 'true' ? '' : 'none';
    } else {
      card.style.display = (area === '__all__' || card.dataset.area === area) ? '' : 'none';
    }
  });
});

async function loadManifest(){
  const res = await fetch('data/manifest.json', {cache:'no-store'});
  MANIFEST = await res.json();
}

async function loadWeekend(satIso){
  lastSatIso = satIso;
  showMsg('');
  const entry = MANIFEST.weekends.find(w => w.sat === satIso);
  if(!entry){
    const first = MANIFEST.weekends[0].sat, last = MANIFEST.weekends[MANIFEST.weekends.length-1].sat;
    showMsg(`この日付(${satIso}の週)のデータはまだありません。対応範囲: ${first} 〜 ${last}（毎週自動生成・拡大されます）`, false);
    document.getElementById('grid').innerHTML = '';
    document.getElementById('chips').innerHTML = '';
    document.getElementById('rangeText').textContent = '';
    document.getElementById('countText').textContent = '';
    return;
  }
  try{
    const res = await fetch('data/' + entry.file, {cache:'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    render(data);
  }catch(e){
    showMsg('データの読み込みに失敗しました。', true);
    document.getElementById('grid').innerHTML = '';
  }
}

document.getElementById('updateBtn').addEventListener('click', function(){
  const v = document.getElementById('dateInput').value;
  if(!v) return;
  loadWeekend(saturdayOf(v));
});

function openCopy(){
  const active = document.querySelector('.chip.active');
  const area = active ? active.dataset.area : '__all__';
  const dateVal = document.getElementById('dateInput').value;
  const p = new URLSearchParams();
  if(dateVal) p.set('date', dateVal);
  if(area !== '__all__') p.set('area', area);
  const qs = p.toString();
  window.open('copy.html' + (qs ? '?' + qs : ''), '_blank', 'noopener');
}

(async function init(){
  const defDate = defaultDate();
  document.getElementById('dateInput').value = defDate;
  await loadManifest();
  showMeta(MANIFEST);
  updateVisitorCount(); // 非同期・ノンブロッキング
  await loadWeekend(saturdayOf(defDate));
})();
</script>
</body>
</html>
